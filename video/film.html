<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#0d0a17;--bg2:#140f24;--surface:#1a1430;--surface2:#221a3d;--line:#2e2550;--purple:#7b3ff5;--purple2:#a47bff;--lav:#d9ccff;--text:#f4f1ff;--muted:#9a92b8;--block:#ff5c7a;--caution:#ffb547;--safe:#35e0a1}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Geist,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 800px at 15% 0%,rgba(123,63,245,.28),transparent 60%),radial-gradient(900px 700px at 100% 100%,rgba(164,123,255,.14),transparent 60%),var(--bg)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(217,204,255,.07) 1.2px,transparent 1.2px);background-size:36px 36px}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.mono{font-family:'Geist Mono',monospace}
.h1{font-weight:700;font-size:84px;line-height:1.04;letter-spacing:-2.5px}
.h2{font-weight:700;font-size:58px;line-height:1.08;letter-spacing:-1.5px}
.kicker{font:600 20px Geist;letter-spacing:3px;text-transform:uppercase;color:var(--purple2)}
.muted{color:var(--muted)}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px;border-radius:20px;font:700 17px Geist;letter-spacing:.6px}
.pill.block{background:rgba(255,92,122,.16);color:var(--block);border:1px solid rgba(255,92,122,.45)}
.pill.caution{background:rgba(255,181,71,.14);color:var(--caution);border:1px solid rgba(255,181,71,.45)}
.pill.safe{background:rgba(53,224,161,.14);color:var(--safe);border:1px solid rgba(53,224,161,.45)}
.pill.purple{background:rgba(123,63,245,.18);color:var(--lav);border:1px solid rgba(164,123,255,.45)}
.badge{display:inline-flex;align-items:center;gap:10px;font:500 17px Geist;color:var(--lav);background:rgba(123,63,245,.14);border:1px solid rgba(164,123,255,.35);border-radius:14px;padding:10px 16px}
.dot{width:9px;height:9px;border-radius:5px;background:var(--safe);box-shadow:0 0 12px var(--safe)}
.row{display:flex;align-items:center}
.find{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);font:400 19px/1.4 Geist;color:var(--text)}
.find b{font:700 13px/22px 'Geist Mono';letter-spacing:.5px;padding:0 9px;border-radius:7px;flex:none;margin-top:2px}
.find b.block{background:rgba(255,92,122,.18);color:var(--block)}
.find b.caution{background:rgba(255,181,71,.16);color:var(--caution)}
.find b.info{background:rgba(164,123,255,.16);color:var(--lav)}
.chat{position:absolute;border-radius:30px;overflow:hidden}
.bubble{position:absolute;right:28px;max-width:640px;background:var(--purple);color:#fff;border-radius:22px 22px 6px 22px;padding:16px 22px;font:500 21px/1.4 Geist}
.tool{position:absolute;left:28px;display:flex;align-items:center;gap:12px;height:46px;padding:0 18px;border-radius:14px;background:#0f0b1c;border:1px solid var(--line);font:500 17px 'Geist Mono';color:var(--lav)}
.spin{width:18px;height:18px;border-radius:9px;border:2.5px solid rgba(164,123,255,.25);border-top-color:var(--purple2)}
.result{position:absolute;left:28px;right:28px;padding:22px 26px;border-radius:22px;background:#120d22;border:1px solid var(--line)}
</style></head>
<body><div id="stage"><div id="dots"></div>
<div id="chrome" class="a" style="inset:0;z-index:20;pointer-events:none"></div>
</div>
<script>
// ---------- timing (song: 130 BPM, sections every 4 bars = 7.385 s) ----------
const SEC = 4 * 4 * 60 / 130, T0 = 0.09;
const at = n => T0 + n * SEC;                       // section boundaries
const DURATION = 118.2;
const FPS_HINT = 30;

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo3 = p => 1 - Math.pow(1 - p, 3);
const eio3 = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eo5 = p => 1 - Math.pow(1 - p, 5);
function spring(t, w = 14, z = 0.62) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }

// ---------- dom ----------
const stage = document.getElementById("stage"), chrome = document.getElementById("chrome");
function el(parent, css = "", html = "", cls = "") { const e = document.createElement("div"); e.className = "a " + cls; e.style.cssText = css; e.innerHTML = html; parent.appendChild(e); return e; }
const rise = (e, p, d = 36) => { e.style.opacity = clamp(p * 1.4); e.style.transform = `translateY(${(1 - p) * d}px)`; };
const pop = (e, p) => { e.style.opacity = clamp(p * 2); e.style.transform = `scale(${0.85 + 0.15 * p})`; };
function typeText(e, text, t, t0, cps = 38) { const n = Math.floor(clamp((t - t0) * cps, 0, text.length)); e.textContent = text.slice(0, n); return n >= text.length; }
const CK = (c = "currentColor", px = 18) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" style="display:inline-block;vertical-align:middle;flex:none"><path d="M4.5,12.5 L9.5,17.5 L19.5,6.5" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const EVENTS = []; window.EVENTS = EVENTS;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---------- brand mark ----------
function logoSVG(size, id) {
  return `<svg width="${size}" height="${size}" viewBox="-60 -60 120 120" style="display:block;overflow:visible">
  <defs><linearGradient id="g${id}" x1="0" y1="-1" x2="0" y2="1"><stop offset="0" stop-color="#a47bff"/><stop offset="1" stop-color="#5b23d6"/></linearGradient>
  <linearGradient id="h${id}" x1="-1" y1="-1" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.35)"/><stop offset=".5" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>
  <path class="lg-shield" d="M0,-50 C16,-41 32,-37 44,-37 C44,4 32,34 0,54 C-32,34 -44,4 -44,-37 C-32,-37 -16,-41 0,-50 Z" fill="url(#g${id})"/>
  <path d="M0,-50 C16,-41 32,-37 44,-37 C44,4 32,34 0,54 C-32,34 -44,4 -44,-37 C-32,-37 -16,-41 0,-50 Z" fill="url(#h${id})"/>
  <path class="lg-check" d="M-21,2 L-6,17 L19,-10" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
  <path class="lg-tip" d="M8,-14 L24,-16 L22,0" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
  </svg>`;
}
const wordmark = (px, color = "#fff") => `<span style="font:700 ${px}px Geist;letter-spacing:${-px * 0.03}px;color:${color}">Safe<span style="color:#b896ff">Send</span></span>`;

// ---------- persistent chrome ----------
const topLogo = el(chrome, "left:64px;top:48px;display:flex;align-items:center;gap:14px", logoSVG(40, "t") + wordmark(28));
const chapter = el(chrome, "right:64px;top:56px;font:600 18px Geist;letter-spacing:3px;color:var(--muted);text-transform:uppercase;text-align:right;width:700px");
const progBg = el(chrome, "left:64px;right:64px;bottom:44px;height:3px;border-radius:2px;background:rgba(217,204,255,.1)");
const progFg = el(progBg, "left:0;top:0;height:3px;border-radius:2px;background:linear-gradient(90deg,#7b3ff5,#b896ff)");
topLogo.querySelector(".lg-check").style.strokeDashoffset = 0; topLogo.querySelector(".lg-tip").style.strokeDashoffset = 0;

// ---------- scene registry ----------
const SCENES = [];
function scene(start, end, label, build) {
  const root = el(stage, "inset:0;z-index:5", "", "scene");
  const s = { start, end, label, root, chrome: true }; s.update = build(root, s); SCENES.push(s); return s;
}

// ===== A · logo =====
scene(0, at(1), "", (r, s) => {
  s.chrome = false;
  const mark = el(r, "left:860px;top:300px;width:200px;height:200px", logoSVG(200, "a"));
  const word = el(r, "left:0;top:540px;width:1920px;text-align:center", wordmark(118));
  const tag = el(r, "left:0;top:690px;width:1920px;text-align:center;font:500 36px Geist;color:var(--lav)", "A payment firewall for AI agents");
  const forr = el(r, "left:0;top:790px;width:1920px;display:flex;justify-content:center", `<span class="pill purple" style="height:48px;font:600 19px Geist;letter-spacing:.3px">Built for PayBox &nbsp;·&nbsp; MoonPay Hackathon, Chapter 1</span>`);
  const sh = mark.querySelector(".lg-shield"), ck = mark.querySelector(".lg-check"), tp = mark.querySelector(".lg-tip");
  return (t) => {
    const m = spring(t - 0.3, 9, 0.6); mark.style.transform = `scale(${0.4 + 0.6 * m}) rotate(${(1 - m) * -12}deg)`; mark.style.opacity = clamp(m * 2);
    ck.style.strokeDashoffset = 1 - eo3(prog(t, 0.9, 1.5)); tp.style.strokeDashoffset = 1 - eo3(prog(t, 1.4, 1.8));
    rise(word, eo3(prog(t, 1.5, 2.3)), 40); rise(tag, eo3(prog(t, 2.2, 2.9))); rise(forr, eo3(prog(t, 3.0, 3.7)));
  };
});

// ===== B · problem hook =====
scene(at(1), at(2), "01 · The problem", (r) => {
  const l1 = el(r, "left:140px;top:300px;width:900px", `<div class="h1">AI agents can now<br><span style="color:var(--purple2)">pay for you.</span></div>`);
  const l2 = el(r, "left:140px;top:560px;width:900px", `<div class="h2" style="color:var(--lav)">But they copy addresses<br>without looking.</div>`);
  const chat = el(r, "left:1100px;top:250px;width:680px;height:560px", "", "card chat");
  el(chat, "left:28px;top:24px;font:600 18px Geist;color:var(--muted)", "Agent chat");
  const ub = el(chat, "top:76px", "", "bubble"); ub.classList.add("bubble");
  const ab = el(chat, "left:28px;top:200px;right:28px;padding:18px 22px;border-radius:22px 22px 22px 6px;background:#0f0b1c;border:1px solid var(--line);font:400 20px/1.5 Geist");
  ab.innerHTML = `Found Acme in your recent activity:<div class="mono" style="margin-top:12px;font-size:19px;line-height:1.9">
    <div>0xd8da…6045 <span class="muted">· 40 USDC · Oct 2</span></div><div>0xd8da…6045 <span class="muted">· 0 USDC · Oct 2</span></div></div>
    <div style="margin-top:10px">Which one is Acme? <span class="muted">They look identical.</span></div>`;
  const warn = el(chat, "left:28px;top:470px", `<span class="pill block">One of them is a scammer</span>`);
  const UB = "Pay Acme 40 USDC, same address as last time.";
  return (t) => {
    rise(l1, eo3(prog(t, 0.3, 1.0))); rise(l2, eo3(prog(t, 2.8, 3.5)));
    rise(chat, eo3(prog(t, 0.8, 1.5)), 50);
    typeText(ub, UB, t, 1.4, 40); ub.style.opacity = t > 1.4 ? 1 : 0;
    rise(ab, eo3(prog(t, 3.0, 3.6))); pop(warn, spring(t - 4.6, 14, 0.55));
  };
});

// ===== C · how poisoning works =====
scene(at(2), at(3), "01 · The problem", (r) => {
  el(r, "left:140px;top:170px", `<div class="kicker">Address poisoning</div>`);
  const title = el(r, "left:140px;top:215px;width:1640px", `<div class="h2">How attackers trick wallets, and agents</div>`);
  const steps = [
    ["1", "You pay Acme", `<span style="color:var(--safe)">0xd8dA</span>6BF2…7a<span style="color:var(--safe)">A96045</span>`, "40 USDC", "safe"],
    ["2", "Attacker mines a lookalike and plants a 0 USDC transfer", `<span style="color:var(--safe)">0xd8da</span><span style="color:var(--block)">1a5f…00</span><span style="color:var(--safe)">a96045</span>`, "0 USDC", "block"],
    ["3", "Your wallet shortens both to the same thing", `0xd8da…6045 &nbsp;=&nbsp; 0xd8da…6045`, "copy → pay", "caution"],
  ];
  const rows = steps.map((s, i) => el(r, `left:140px;top:${350 + i * 170}px;width:1640px;height:140px;display:flex;align-items:center;gap:36px;padding:0 40px`, `
    <div style="width:64px;height:64px;border-radius:32px;background:rgba(123,63,245,.2);border:1px solid rgba(164,123,255,.5);display:flex;align-items:center;justify-content:center;font:700 26px Geist;color:var(--lav)">${s[0]}</div>
    <div style="width:560px;font:500 26px/1.35 Geist">${s[1]}</div>
    <div class="mono" style="flex:1;font-size:30px">${s[2]}</div>
    <span class="pill ${s[4]}">${s[3]}</span>`, "card"));
  const foot = el(r, "left:140px;top:870px;width:1640px;font:500 24px Geist;color:var(--lav)", "First 4 and last 6 characters match. Humans skim them. Agents don't check at all.");
  return (t) => { rise(title, eo3(prog(t, 0.1, 0.7))); rows.forEach((e, i) => rise(e, eo3(prog(t, 0.9 + i * 1.7, 1.6 + i * 1.7)), 40)); rise(foot, eo3(prog(t, 5.6, 6.2))); };
});

// ===== D · research =====
scene(at(3), at(4) - 0.05, "02 · The research", (r) => {
  const title = el(r, "left:140px;top:170px;width:1640px", `<div class="kicker">Peer-reviewed research</div><div class="h2" style="margin-top:14px">This is not hypothetical.</div>`);
  const cards = [
    ["$83.8M+", "stolen across 270M poisoning attacks on 17M victims", "Tsuchiya et al. · Blockchain Address Poisoning · 2025", "arXiv:2501.16681"],
    ["3 of 53", "popular wallets warn before you pay a phishing address", "Guan &amp; Li · Ethereum Crypto Wallets under Address Poisoning · 2025", "arXiv:2508.12107"],
    ["&lt;30%", "of attacks on Web3 agents are stopped by today's protections", "Karanjai et al. · When Agents Act on Web3 · 2026", "arXiv:2608.17275"],
    ["65%", "of retried agent payments end up paying twice", "Srivastava &amp; Paul · Agentic Commerce Bench · 2026", "arXiv:2609.35886"],
  ].map((c, i) => el(r, `left:${140 + (i % 2) * 830}px;top:${360 + Math.floor(i / 2) * 290}px;width:810px;height:260px;padding:34px 40px`, `
    <div style="font:700 72px Geist;letter-spacing:-2px;color:${i === 0 ? "var(--block)" : "var(--purple2)"}">${c[0]}</div>
    <div style="font:500 25px/1.35 Geist;margin-top:8px;width:720px">${c[1]}</div>
    <div style="position:absolute;left:40px;bottom:28px;font:400 17px Geist;color:var(--muted)">${c[2]} &nbsp;<span class="mono" style="color:var(--lav)">${c[3]}</span></div>`, "card"));
  return (t) => { rise(title, eo3(prog(t, 0.1, 0.7))); cards.forEach((e, i) => rise(e, eo3(prog(t, 0.9 + i * 1.1, 1.6 + i * 1.1)), 40)); };
});

// ===== E · meet SafeSend (drop) =====
scene(at(4) - 0.05, at(5), "03 · The solution", (r, s) => {
  s.chrome = false;
  const flood = el(r, "border-radius:50%;background:radial-gradient(circle,#8a52ff 0%,#5b23d6 70%)");
  const mark = el(r, "left:885px;top:200px;width:150px;height:150px", logoSVG(150, "e"));
  const meet = el(r, "left:0;top:390px;width:1920px;text-align:center", `<div class="h1" style="font-size:110px">Meet ${wordmark(110)}</div>`);
  const line = el(r, "left:0;top:560px;width:1920px;text-align:center;font:500 40px Geist;color:#efe8ff", "PayBox checks <b>what</b> you sign. SafeSend checks <b>who</b> you pay.");
  const quote = el(r, "left:410px;top:700px;width:1100px;padding:28px 36px;border-radius:24px;background:rgba(13,10,23,.35);border:1px solid rgba(255,255,255,.18)", `
    <div style="font:400 23px/1.5 Geist;color:#f4f1ff">“The ideal wallet should match suspicious transfers with a previous legitimate transfer by comparing address similarity … and verify every recipient before sending.”</div>
    <div style="margin-top:12px;font:500 18px Geist;color:#d9ccff">Guan &amp; Li, 2025 · <span class="mono">arXiv:2508.12107</span> &nbsp;—&nbsp; SafeSend does exactly this, for AI agents.</div>`);
  return (t) => {
    const R = eio3(prog(t, 0.05, 0.5)) * 1200; flood.style.left = (960 - R) + "px"; flood.style.top = (540 - R) + "px"; flood.style.width = flood.style.height = 2 * R + "px";
    const m = spring(t - 0.35, 11, 0.55); mark.style.transform = `scale(${m})`; mark.style.opacity = clamp(m * 2);
    const ck = mark.querySelector(".lg-check"), tp = mark.querySelector(".lg-tip"); ck.style.strokeDashoffset = 1 - eo3(prog(t, 0.6, 1.0)); tp.style.strokeDashoffset = 1 - eo3(prog(t, 0.9, 1.2));
    rise(meet, eo3(prog(t, 0.6, 1.2)), 50); rise(line, eo3(prog(t, 1.4, 2.0))); rise(quote, eo3(prog(t, 3.0, 3.7)));
  };
});

// ===== F · architecture =====
scene(at(5), at(6), "03 · How it works", (r) => {
  const title = el(r, "left:140px;top:170px;width:1640px", `<div class="kicker">Architecture</div><div class="h2" style="margin-top:14px">A safety check between your agent and your money</div>`);
  const nodes = [["You", "ask in plain words"], ["Claude", "your AI agent"], ["PayBox MCP", "use_plugin"], ["SafeSend", "5 MCP tools"], ["PayBox", "you approve & sign"], ["Base", "USDC settles"]];
  const xs = nodes.map((_, i) => 140 + i * 288);
  const line = el(r, "left:240px;top:487px;width:1440px;height:3px;background:rgba(164,123,255,.25)");
  const nodeEls = nodes.map((n, i) => el(r, `left:${xs[i]}px;top:410px;width:220px;height:156px;padding:24px;text-align:center;${i === 3 ? "border-color:#a47bff;box-shadow:0 0 0 1px #a47bff,0 0 60px rgba(123,63,245,.55)" : ""}`,
    `<div style="font:700 28px Geist">${i === 3 ? wordmark(28) : n[0]}</div><div style="margin-top:10px;font:400 18px Geist;color:var(--muted)">${n[1]}</div>`, "card"));
  const packet = el(r, "width:18px;height:18px;border-radius:9px;background:#b896ff;box-shadow:0 0 18px #b896ff;top:479px;z-index:0");
  nodeEls.forEach(e => e.style.zIndex = 1);
  const checks = ["Lookalike & poisoning", "OFAC sanctions", "Fake-token invoices", "Spoofed Basenames", "Checksum typos", "Duplicates & outliers"];
  const chipEls = checks.map((c, i) => el(r, `left:${140 + (i % 3) * 560}px;top:${640 + Math.floor(i / 3) * 70}px`, `<span class="pill purple" style="height:50px;font:600 20px Geist">${CK("#b896ff", 20)} ${c}</span>`));
  const cap = el(r, "left:140px;top:820px;width:1640px;font:500 23px Geist;color:var(--lav)", "SafeSend never holds keys or signs. It returns SAFE, CAUTION or BLOCK, and only safe payments become a PayBox proposal.");
  return (t) => {
    rise(title, eo3(prog(t, 0.1, 0.7))); nodeEls.forEach((e, i) => rise(e, eo3(prog(t, 0.6 + i * 0.22, 1.1 + i * 0.22)), 30));
    line.style.transform = `scaleX(${eo3(prog(t, 0.6, 2.0))})`; line.style.transformOrigin = "0 0";
    const pp = ((t - 2.0) % 2.6) / 2.6; packet.style.display = t > 2.0 ? "block" : "none"; packet.style.left = (240 + eio3(clamp(pp)) * 1440 - 9) + "px";
    chipEls.forEach((e, i) => rise(e, eo3(prog(t, 2.6 + i * 0.25, 3.1 + i * 0.25)), 24)); rise(cap, eo3(prog(t, 4.6, 5.2)));
  };
});

// ===== G · live in PayBox =====
scene(at(6), at(7), "04 · Live in PayBox", (r) => {
  const title = el(r, "left:140px;top:170px;width:1640px", `<div class="kicker">Live in PayBox</div><div class="h2" style="margin-top:14px">Installed, enabled, and callable by Claude</div>`);
  const tools = [["check_address_lookalike", "Check address for lookalikes", "read-only"], ["screen_recipient", "Screen a Base payment recipient", "read-only"], ["scan_wallet_poisoning", "Scan a wallet for poisoning", "read-only"], ["verify_payment_request", "Verify an invoice or payment link", "read-only"], ["send_usdc", "Send USDC on Base (SafeSend)", "proposes payment"]];
  const card = el(r, "left:140px;top:320px;width:900px;height:640px;padding:36px 40px", `
    <div class="row" style="gap:14px;font:600 18px Geist;color:var(--muted)">PayBox &nbsp;›&nbsp; Plugins &nbsp;›&nbsp; Unofficial</div>
    <div class="row" style="gap:20px;margin-top:22px">${logoSVG(64, "g")}<div><div style="font:700 30px Geist">SafeSend: Payment Firewall for AI Agents</div>
      <div class="row" style="gap:10px;margin-top:10px"><span class="pill safe" style="height:32px;font-size:15px"><span class="dot"></span>Enabled</span><span class="pill purple" style="height:32px;font-size:15px">Protocol 2026-07-28</span></div></div></div>
    <div style="margin-top:22px;font:400 19px/1.45 Geist;color:var(--lav)">Stops your AI agent from paying scammers. Before PayBox asks you to approve a USDC payment on Base, SafeSend checks the recipient for address poisoning, spoofed names, fake-token invoices, OFAC sanctions, typos and duplicate payments.</div>
    <div style="margin-top:18px">${tools.map(x => `<div class="row" style="justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)"><span class="mono" style="font-size:17px;color:#fff">${x[0]}</span><span style="font:500 15px Geist;color:${x[2] === "read-only" ? "var(--muted)" : "var(--caution)"}">${x[2]}</span></div>`).join("")}</div>`, "card");

// ===== feature scene factory =====
function feature(start, end, num, o) {
  return scene(start, end, `05 · Features`, (r) => {
    const left = el(r, "left:140px;top:250px;width:640px", `
      <div class="kicker">Feature ${num}</div>
      <div class="h2" style="margin-top:16px;font-size:54px">${o.title}</div>
      <div style="margin-top:24px;font:400 24px/1.5 Geist;color:var(--lav)">${o.desc}</div>
      <div style="margin-top:34px"><span class="mono" style="font-size:19px;color:#fff;background:#0f0b1c;border:1px solid var(--line);border-radius:12px;padding:10px 16px">${o.tool}</span></div>
      <div style="margin-top:34px"><span class="badge"><span class="dot"></span>${o.source}</span></div>`);
    const chat = el(r, `left:860px;top:200px;width:920px;height:${o.h || 760}px`, "", "card chat");
    el(chat, "left:28px;top:24px;font:600 18px Geist;color:var(--muted);display:flex;align-items:center;gap:10px", `<span class="dot" style="background:#a47bff;box-shadow:0 0 12px #a47bff"></span>Claude · PayBox connector`);
    const ub = el(chat, "top:76px", "", "bubble");
    const tool = el(chat, `top:${o.toolTop || 200}px`, `<div class="spin"></div><span>use_plugin → safesend.${o.tool.split("(")[0]}</span>`, "tool");
    const res = el(chat, `top:${(o.toolTop || 200) + 70}px`, `
      <div class="row" style="gap:14px"><span class="pill ${o.verdict}">${o.verdictLabel}</span>${o.meta ? `<span style="font:500 17px Geist;color:var(--muted)">${o.meta}</span>` : ""}</div>
      ${o.findings.map(f => `<div class="find"><b class="${f[0]}">${f[1]}</b><span>${f[2]}</span></div>`).join("")}`, "result");
    res.firstElementChild.style.marginBottom = "12px";
    const spin = tool.querySelector(".spin");
    { const tT0 = 1.0 + o.prompt.length / (o.cps || 46) + 0.3; EVENTS.push({ t: start + tT0, k: "tool" }, { t: start + tT0 + 1.0, k: o.verdict }); }
    return (t) => {
      rise(left, eo3(prog(t, 0.2, 0.9))); rise(chat, eo3(prog(t, 0.4, 1.1)), 50);
      ub.style.opacity = t > 1.0 ? 1 : 0; const typed = typeText(ub, o.prompt, t, 1.0, o.cps || 46);
      const tT = 1.0 + o.prompt.length / (o.cps || 46) + 0.3;
      rise(tool, eo3(prog(t, tT, tT + 0.35)), 16);
      const done = t > tT + 1.0;
      spin.style.transform = `rotate(${t * 540}deg)`;
      if (done && !spin.dataset.d) { spin.dataset.d = 1; spin.outerHTML = CK("#35e0a1", 20); }
      if (!done && spin.dataset?.d) {}
      rise(res, eo3(prog(t, tT + 1.0, tT + 1.6)), 30);
      [...res.querySelectorAll(".find")].forEach((f, i) => rise(f, eo3(prog(t, tT + 1.4 + i * 0.35, tT + 1.9 + i * 0.35)), 14));
    };
  });
}

// ---------- seek ----------
const EXIT = 0.5;
function seek(t) {
  let chromeOn = false, label = "";
  for (const s of SCENES) {
    const on = t >= s.start && t < s.end;
    s.root.style.display = on ? "block" : "none";
    if (!on) continue;
    const lt = t - s.start;
    s.update(lt);
    const ex = eio3(prog(t, s.end - EXIT, s.end));
    s.root.style.opacity = s === SCENES[SCENES.length - 1] ? 1 : 1 - ex;
    s.root.style.transform = `translateY(${-ex * 30}px)`;
    if (s.chrome) { chromeOn = true; label = s.label; }
  }
  chrome.style.opacity = chromeOn ? 1 : 0;
  chapter.textContent = label;
  progFg.style.width = (clamp(t / DURATION) * 100) + "%";
}
window.seek = seek; window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
